<!DOCTYPE html>
<html>
<head>
    <title>LoL Death Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <a class="top-bar-title" href="http://localhost:5173">LoL DEATH MAP</a>
    </header>
    <div class="search-wrap">
        <div class="search-bar">
        <select id="region">
            <option value="na1">NA</option>
            <option value="euw1">EUW</option>
            <option value="eun1">EUNE</option>
            <option value="kr">KR</option>
            <option value="jp1">JP</option>
            <option value="br1">BR</option>
            <option value="la1">LAN</option>
            <option value="la2">LAS</option>
            <option value="oc1">OCE</option>
            <option value="tr1">TR</option>
            <option value="ru">RU</option>
        </select>
        <input type="text" id="riotId" placeholder="Game name #Tag" autocomplete="off">
        <button id="searchBtn" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg></button>
        </div>
        <div id="historyDropdown" class="history-dropdown" hidden></div>
    </div>
    <div class="page-width">
  <div id="notFound" class="not-found">
    <p class="not-found-code">404</p>
    <h2 class="not-found-title">Summoner not found</h2>
    <p class="not-found-text" id="notFoundText"></p>
  </div>
    <div class="summoner-info">
        <img id="summonerIcon" alt="">
        <div>
            <h2 class="summoner-name" id="summonerName">--</h2>
            <p class="summoner-subline"><span id="summonerRegion">--</span> · <span id="summonerLevel">--</span></p>
            <p class="summoner-rank" id="summonerRank">--</p>
        </div>
    </div>
    <div class="page-layout">
        <div class="left-column">
            <div id="matchHistory" class="match-history"></div>
            <div class="sidebar">
            <div class="stat-box">
                <p class="stat-label">Total deaths</p>
                <p class="stat-value" id="totalDeathsStat">--</p>
            </div>
            <div class="stat-box">
                <p class="stat-label">Games analyzed</p>
                <p class="stat-value" id="gamesAnalyzedStat">--</p>
            </div>
            <div class="stat-box">
                <p class="stat-label">Most common killer</p>
                <p class="stat-value" id="mostCommonKillerStat">--</p>
            </div>
            <div class="stat-box">
                <p class="stat-label">Win rate</p>
                <p class="stat-value" id="winRateStat">--</p>
            </div>
            <div class="stat-box">
                <p class="stat-label">Avg KDA</p>
                <p class="stat-value" id="avgKdaStat">--</p>
            </div>
            <div class="stat-box">
                <p class="stat-label">Avg deaths / game</p>
                <p class="stat-value" id="avgDeathsStat">--</p>
            </div>
            <div class="stat-box">
                <p class="stat-label">Avg time of death</p>
                <p class="stat-value" id="avgDeathTimeStat">--</p>
            </div>
            <div class="stat-box">
                <p class="stat-label">Early / mid / late</p>
                <p class="stat-value" id="deathSplitStat">--</p>
            </div>
            </div>
        </div>
        <div class="content-panel">
            <div class="map-container">
                <img src="rift.png" class="map-layer">
                <canvas id="heatmapCanvas" class="map-layer" width="512" height="512"></canvas>
                <div id="dotTooltip" class="tooltip"></div>
            </div>
            <div class="legend">
                <span>Fewer deaths</span>
                <div class="legend-bar"></div>
                <span>More deaths</span>
            </div>
            <div class="view-toggle">
                <button id="heatmapModeBtn" class="active">Heatmap</button>
                <button id="dotsModeBtn">Dots</button>
            </div>
            <div class="loading-overlay" id="loading-overlay">
                <img class="loading-image" src="loading.gif">
                <p>Loading...</p>
            </div>
            <pre id="deathList"></pre>
        </div>
    </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
